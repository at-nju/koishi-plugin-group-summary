<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="group-summary-data" content="/data">
    <meta name="description" content="快速了解最近的群聊话题">
    <title>NJU-AIA 群聊话题总结</title>
    <script>
      (() => {
        const stored = localStorage.getItem('theme')
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <link rel="stylesheet" href="./app.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body class="min-h-screen bg-paper text-ink antialiased">
    <header class="mx-auto w-full max-w-3xl px-6 pb-8 pt-14">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="mb-3 text-xs font-bold uppercase tracking-[0.22em] text-accent">Group Brief</p>
          <h1 class="text-3xl font-bold leading-tight">群聊话题总结</h1>
        </div>
        <button id="theme-toggle" type="button" aria-label="切换深浅色模式" class="flex items-center rounded-full border border-line bg-card p-2.5 text-ink/60 transition-colors hover:border-accent/50 hover:text-accent">
          <svg class="theme-icon theme-icon--moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="theme-icon theme-icon--sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
      </div>
    </header>
    <main class="mx-auto w-full max-w-3xl px-6">
      <p id="status" role="status" class="mb-4 text-sm text-ink/50">正在读取最新话题…</p>
      <section id="topics" aria-label="最近话题" class="flex flex-col gap-4"></section>
      <button id="more" type="button" hidden class="mx-auto mb-16 mt-8 block rounded-full border border-line bg-card px-8 py-3 text-sm text-ink/60 transition-colors hover:border-accent/50 hover:text-accent">加载更早话题</button>
    </main>
  </body>
</html>
